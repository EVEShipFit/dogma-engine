name: Release

on:
  release:
    types:
    - published

permissions:
  contents: read
  id-token: write

jobs:
  registries:
    name: Publish to NPM and crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Node toolchain
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        registry-url: https://registry.npmjs.org

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Authenticate with crates.io
      id: crates-io-auth
      uses: rust-lang/crates-io-auth-action@v1

    - name: Set version
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        sed -i 's/version = "0.0.0-git"/version = "'${VERSION}'"/' Cargo.toml
        sed -i 's/^version = "0.0.0"$/version = "'${VERSION}'"/' crates/esf-python/Cargo.toml

    - name: Create NPM package
      run: |
        wasm-pack build crates/esf-wasm --profile wasm --target web --out-dir ../../pkg
        cp LICENSE crates/esf-wasm/README.md pkg/
        sed -i 's%"name": "esf-wasm"%"name": "@eveshipfit/dogma-engine"%' pkg/package.json

    - name: Publish to NPM
      run: |
        npm publish ./pkg --access public

    - name: Publish to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      run: |
        cargo publish --workspace --allow-dirty

  wheels:
    name: Build Python wheels (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        platform:
        - runner: ubuntu-latest
          target: x86_64
        - runner: ubuntu-24.04-arm
          target: aarch64
        - runner: macos-latest
          target: universal2
        - runner: windows-latest
          target: x64

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Set version
      shell: bash
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        sed -i.bak 's/^version = "0.0.0"$/version = "'${VERSION}'"/' pyproject.toml
        rm -f pyproject.toml.bak

    - name: Build wheel
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.platform.target }}
        args: --release --locked --out dist
        manylinux: auto

    - name: Upload wheel
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.platform.target }}
        path: dist

  sdist:
    name: Build Python sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set version
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        sed -i 's/^version = "0.0.0"$/version = "'${VERSION}'"/' pyproject.toml

    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: wheels-sdist
        path: dist

  natives:
    name: Build native libraries (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        platform:
        - runner: ubuntu-latest
          name: linux-x86_64
          rid: linux-x64
          target: x86_64-unknown-linux-gnu
          prefix: lib
          extension: so
          # Runs on glibc 2.17 and up, like manylinux2014.
          glibc: ".2.17"
        - runner: ubuntu-24.04-arm
          name: linux-aarch64
          rid: linux-arm64
          target: aarch64-unknown-linux-gnu
          prefix: lib
          extension: so
          glibc: ".2.17"
        - runner: macos-latest
          name: macos-aarch64
          rid: osx-arm64
          target: aarch64-apple-darwin
          prefix: lib
          extension: dylib
        - runner: macos-latest
          name: macos-x86_64
          rid: osx-x64
          target: x86_64-apple-darwin
          prefix: lib
          extension: dylib
        - runner: windows-latest
          name: windows-x86_64
          rid: win-x64
          target: x86_64-pc-windows-msvc
          prefix: ""
          extension: dll

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable
        target: ${{ matrix.platform.target }}

    - name: Install Zig
      if: matrix.platform.glibc
      uses: mlugg/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install cargo-zigbuild
      if: matrix.platform.glibc
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild

    - name: Build libraries
      shell: bash
      run: |
        if [ -n "${{ matrix.platform.glibc }}" ]; then
          cargo zigbuild --release --locked -p esf-kotlin -p esf-dotnet --target ${{ matrix.platform.target }}${{ matrix.platform.glibc }}
        else
          cargo build --release --locked -p esf-kotlin -p esf-dotnet --target ${{ matrix.platform.target }}
        fi

        RELEASE=target/${{ matrix.platform.target }}/release/${{ matrix.platform.prefix }}esf_dogma_engine

        mkdir -p jni/fit/eveship/dogma/natives/${{ matrix.platform.name }}
        cp ${RELEASE}_jni.${{ matrix.platform.extension }} jni/fit/eveship/dogma/natives/${{ matrix.platform.name }}/

        mkdir -p dotnet/${{ matrix.platform.rid }}/native
        cp ${RELEASE}_dotnet.${{ matrix.platform.extension }} dotnet/${{ matrix.platform.rid }}/native/

    - name: Upload JNI library
      uses: actions/upload-artifact@v7
      with:
        name: natives-jni-${{ matrix.platform.name }}
        path: jni

    - name: Upload .NET library
      uses: actions/upload-artifact@v7
      with:
        name: natives-dotnet-${{ matrix.platform.rid }}
        path: dotnet

  maven:
    name: Publish to Maven Central
    needs: [natives]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: "9.8.2"

    - name: Download libraries
      uses: actions/download-artifact@v8
      with:
        pattern: natives-jni-*
        merge-multiple: true
        path: natives

    - name: Build JAR
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        gradle -p crates/esf-kotlin jar sourcesJar -Pversion=${VERSION} -Pnatives=${PWD}/natives

    - name: Upload JAR
      uses: actions/upload-artifact@v7
      with:
        name: jar
        path: crates/esf-kotlin/build/libs

    - name: Publish to Maven Central
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)

        gradle -p crates/esf-kotlin publishAndReleaseToMavenCentral -Pversion=${VERSION} -Pnatives=${PWD}/natives

  nuget:
    name: Publish to NuGet
    needs: [natives]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"

    - name: Download libraries
      uses: actions/download-artifact@v8
      with:
        pattern: natives-dotnet-*
        merge-multiple: true
        path: natives

    - name: Build package
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        dotnet pack crates/esf-dotnet/dotnet -c Release -p:Version=${VERSION} -p:Natives=${PWD}/natives -o dist

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: dist

    - name: Authenticate with NuGet
      id: nuget-auth
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      run: |
        dotnet nuget push dist/*.nupkg --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download wheels
      uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
