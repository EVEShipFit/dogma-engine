name: Release

on:
  release:
    types:
    - published

permissions:
  contents: read
  id-token: write

jobs:
  registries:
    name: Publish to NPM and crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Node toolchain
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        registry-url: https://registry.npmjs.org

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Authenticate with crates.io
      id: crates-io-auth
      uses: rust-lang/crates-io-auth-action@v1

    - name: Set version
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        sed -i 's/version = "0.0.0-git"/version = "'${VERSION}'"/' Cargo.toml
        sed -i 's/^version = "0.0.0"$/version = "'${VERSION}'"/' crates/esf-python/Cargo.toml

    - name: Create NPM package
      run: |
        wasm-pack build crates/esf-wasm --profile wasm --target web --out-dir ../../pkg
        cp LICENSE README.md pkg/
        sed -i 's%"name": "esf-wasm"%"name": "@eveshipfit/dogma-engine"%' pkg/package.json

    - name: Publish to NPM
      run: |
        npm publish ./pkg --access public

    - name: Publish to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      run: |
        cargo publish --workspace --allow-dirty

  wheels:
    name: Build Python wheels (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        platform:
        - runner: ubuntu-latest
          target: x86_64
        - runner: ubuntu-24.04-arm
          target: aarch64
        - runner: macos-latest
          target: universal2
        - runner: windows-latest
          target: x64

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Set version
      shell: bash
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        sed -i.bak 's/^version = "0.0.0"$/version = "'${VERSION}'"/' pyproject.toml
        rm -f pyproject.toml.bak

    - name: Build wheel
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.platform.target }}
        args: --release --locked --out dist
        manylinux: auto

    - name: Upload wheel
      uses: actions/upload-artifact@v5
      with:
        name: wheels-${{ matrix.platform.target }}
        path: dist

  sdist:
    name: Build Python sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set version
      run: |
        # Remove the "v" from the version.
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        echo "Version: ${VERSION}"

        sed -i 's/^version = "0.0.0"$/version = "'${VERSION}'"/' pyproject.toml

    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: Upload sdist
      uses: actions/upload-artifact@v5
      with:
        name: wheels-sdist
        path: dist

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download wheels
      uses: actions/download-artifact@v6
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
