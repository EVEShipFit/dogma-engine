name: Testing

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  testing:
    name: Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable
        components: rustfmt

    - name: Install NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        registry-url: https://npm.pkg.github.com
        scope: "@eveshipfit"
        cache: npm

    - name: Install Protobuf Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends protobuf-compiler

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Install NPM dependencies
      # The token has to be set here, as setup-node only writes a reference to
      # this variable into .npmrc; it is resolved when npm actually runs.
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm ci

    - name: Build WASM library
      run: |
        wasm-pack build --release --target web -- --locked --no-default-features --features wasm,eft

    - name: Build Rust binary
      run: |
        cargo build --release --locked --no-default-features --features rust,eft

    - name: Check coding style
      run: |
        cargo fmt --check
