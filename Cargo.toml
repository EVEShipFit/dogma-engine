[workspace]
resolver = "3"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.0.0-git"
authors = ["EVEShipFit Team <info@eveship.fit>"]
edition = "2024"
repository = "https://github.com/EVEShipFit/dogma-engine"
license = "MIT"
readme = "README.md"
keywords = ["eve-online", "sde", "dogma-engine"]

[workspace.dependencies]
esf-data = { path = "crates/esf-data", version = "0.0.0-git" }
esf-dogma-engine = { path = "crates/esf-dogma-engine", version = "0.0.0-git" }
esf-format = { path = "crates/esf-format", version = "0.0.0-git" }

base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
console_error_panic_hook = "0.1"
dirs = "7.0"
elsa = "1.11"
esf = "1.0"
flatbuffers = "25.2.10"
flate2 = "1.1"
insta = { version = "1.48.0", features = ["glob"] }
jni = "0.22"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pythonize = "0.29"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
tar = "0.4"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "io-std"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
ureq = "3.5"
wasm-bindgen = "0.2"

# WASM is shipped over the wire, so it trades speed for size.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
