[workspace]
resolver = "3"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.0.0-git"
authors = ["EVEShipFit Team <info@eveship.fit>"]
edition = "2024"
repository = "https://github.com/EVEShipFit/dogma-engine"
license = "MIT"
readme = "README.md"
keywords = ["eve-online", "sde", "dogma-engine"]

[workspace.dependencies]
esf-data = { path = "crates/esf-data", version = "0.0.0-git" }
esf-dogma-engine = { path = "crates/esf-dogma-engine", version = "0.0.0-git" }
esf-format = { path = "crates/esf-format", version = "0.0.0-git" }

clap = { version = "4.5", features = ["derive"] }
console_error_panic_hook = "0.1"
flatbuffers = "25.2.10"
insta = { version = "1.48.0", features = ["glob"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
strum = "0.28"
strum_macros = "0.28"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
