[package]
name = "esf-dogma-engine"
version = "0.0.0-git"
authors = ["EVEShipFit Team <info@eveship.fit>"]
edition = "2024"
repository = "https://github.com/EVEShipFit/dogma-engine"
description = "Library to calculate statistics for EVE Online ship fits"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# The binary and the regression suite both need the "rust" feature.
[[bin]]
name = "esf-dogma-engine"
path = "src/main.rs"
required-features = ["rust"]

[[test]]
name = "regression"
path = "tests/regression.rs"
required-features = ["rust"]

[dependencies]
flatbuffers = "25.2.10"
serde = { version = "1.0", features = ["derive"] }
strum = "0.28"
strum_macros = "0.28"

# "rust" dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# "wasm" dependencies
console_error_panic_hook = { version = "0.1", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = "s"

[features]
default = ["eft", "rust", "wasm"]
eft = []
rust = ["dep:clap", "dep:serde_json"]
wasm = ["dep:console_error_panic_hook", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dev-dependencies]
insta = { version = "1.48.0", features = ["glob"] }
