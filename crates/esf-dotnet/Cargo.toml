[package]
name = "esf-dotnet"
# Published to NuGet instead.
publish = false
description = "Library to calculate statistics for EVE Online ship fits"
# Not the workspace version: the NuGet package takes its version from MSBuild,
# and a fixed value here keeps Cargo.lock stable across releases.
version = "0.0.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "esf_dogma_engine_dotnet"
crate-type = ["cdylib"]

[dependencies]
esf-data.workspace = true
esf-dogma-engine.workspace = true
esf-format.workspace = true
serde.workspace = true
serde_json.workspace = true
